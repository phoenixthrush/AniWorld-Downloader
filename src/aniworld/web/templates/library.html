{% extends "base.html" %}

{% block title %}Library - AniWorld Downloader{% endblock %}

{% block content %}
<div class="container container-narrow">
  <div class="page-head">
    <h1 data-i18n="library.title">Library</h1>
    <button class="btn btn-ghost" id="libraryRefresh" data-i18n="common.refresh">Refresh</button>
  </div>
  <p class="page-hint" data-i18n="library.hint">
    Each folder's series/movie type is read up front; episode files still only load when you open a title.
  </p>
  <div id="libraryTree" class="library-tree"></div>
</div>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='library.js') }}?v={{ app_version }}"></script>
{% endblock %}
