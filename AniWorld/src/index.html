<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AniWorld</title>
  <script type="module" src="/main.js" defer></script>
</head>

<body>
  <main class="container">
    <h1>Welcome to AniWorld</h1>

    <input type="text" name="query" id="query" placeholder="Search for an anime">
    <select id="anime"></select>

    <textarea id="episode" name="episode" rows="5" cols="33"></textarea>
    <button type="submit" id="submit">Search</button>

    <div class="selection">
      <select id="provider"></select>
      <select id="language"></select>
    </div>

    <div id="status"></div>
    <button id="copy" type="button">Copy</button>
  </main>
  <div id="copyright">&copy;2025 phoenixthrush</div>
</body>

</html>
