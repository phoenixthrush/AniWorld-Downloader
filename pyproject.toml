[project]
name = "aniworld"
version = "5.0.3"
authors = [{ name = "Phoenixthrush UwU", email = "contact@phoenixthrush.com" }]
maintainers = [
  { name = "Phoenixthrush UwU", email = "contact@phoenixthrush.com" },
  { name = "Sirox", email = "iloveshell@proton.me"}
]
description = "AniWorld-Downloader is a command-line tool for downloading and streaming movies and series."
readme = "README.md"
requires-python = ">=3.10"
# requires version numbers from 06/2026
dependencies = [
  "certifi",                                                                  # CA bundle for bundled runtimes
  "niquests",                                                                 # >=3.7
  "npyscreen",                                                                # >=3.7
  "ffmpeg-python",                                                            # ???
  "python-dotenv",                                                            # >=3.10
  "rich",                                                                     # >=3.9.0
  "flask",                                                                    # >=3.9
  "flask-wtf",                                                                # >=3.10
  "waitress",                                                                 # >=3.9.0
  "packaging",                                                                # >=3.8
  "cryptography",                                                             # !=3.9.0, !=3.9.1, >=3.9
  "patchright",                                                               # >=3.9
  "curl_cffi",                                                                # TLS impersonation for Cloudflare-gated hosters (VOE)
  'windows-curses<3.14; sys_platform == "win32" and python_version < "3.14"', # ??? - npyscreen on Windows
]


classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
license = "MIT"
license-files = ["LICENSE"]

[project.optional-dependencies]
sso = [
  "authlib",                                                                  # >=3.10
]
discord = [
  "discord.py",                                                               # optional Discord request bot
]
test = [
  "pytest",
]
all = [
  "authlib",
  "discord.py",
]


[project.urls]
homepage = "https://github.com/phoenixthrush/AniWorld-Downloader"
changelog = "https://github.com/phoenixthrush/AniWorld-Downloader/commits/models"
documentation = "https://www.phoenixthrush.com/AniWorld-Downloader-Docs/"
bugs = "https://github.com/phoenixthrush/AniWorld-Downloader/issues"
issues = "https://github.com/phoenixthrush/AniWorld-Downloader/issues"
tracker = "https://github.com/phoenixthrush/AniWorld-Downloader/issues"
download = "https://pypi.org/project/aniworld/#files"
sponsor = "https://github.com/sponsors/phoenixthrush"
funding = "https://github.com/sponsors/phoenixthrush"
donate = "https://github.com/sponsors/phoenixthrush"
discord = "https://discord.com/invite/BfDvrKd8V5"

[tool.setuptools.package-data]
aniworld = [
  ".env.example",
  "ascii/ASCII.txt",
  "aniskip/scripts/*.lua",
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/*.ico",
  "web/static/*.png",
  "web/static/*.webp",
  "web/static/flags/*.svg",
  "web/static/flags/LICENSE.txt",
  "browsers.jsonl",
]

[project.scripts]
aniworld = "aniworld.__main__:main"

[tool.ruff.lint.per-file-ignores]
# schedule.py works on naive wall-clock datetimes by design: that is what keeps
# a cron line at 22:00 across a DST switch. Its tests build them by hand, so the
# "always pass a timezone" rule does not apply to them.
"tests/test_schedule.py" = ["DTZ001"]
# Both set an environment variable that has to be in place before aniworld is
# imported, so their imports cannot all sit at the top of the file.
"tests/autosync_simulation.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The two legacy scripts in tests/ are manual smoke checks against the live
# sites. They expose no test functions, so pytest collects nothing from them.
python_files = ["test_*.py"]
addopts = "--strict-markers"
