name: Build Executable with Nuitka

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}
    permissions:
      contents: write

    steps:
      - name: Check-out repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install your Dependencies
        run: |
          pip install imageio .

      - name: Build Executable with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: src/aniworld

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ runner.os }} Build
          include-hidden-files: true
          path: |
            build/AniWorldDownloader.exe
            build/AniWorldDownloader
            build/aniworld.app/**/*

      - name: Prepare Release Assets
        shell: bash
        run: |
          cd build || exit 0
          if [ "${{ runner.os }}" = "macOS" ]; then
            tar -czf AniWorldDownloader-macOS.tar.gz aniworld.app 2>/dev/null || echo "No aniworld.app found"
          elif [ "${{ runner.os }}" = "Windows" ]; then
            mv AniWorldDownloader.exe AniWorldDownloader-Windows.exe 2>/dev/null || mv aniworld.exe AniWorldDownloader-Windows.exe 2>/dev/null || echo "No exe found"
          else
            mv AniWorldDownloader AniWorldDownloader-Linux 2>/dev/null || mv aniworld AniWorldDownloader-Linux 2>/dev/null || echo "No linux bin found"
          fi

      - name: Upload to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/AniWorldDownloader-Windows.exe
            build/AniWorldDownloader-Linux
            build/AniWorldDownloader-macOS.tar.gz
