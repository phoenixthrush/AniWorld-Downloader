name: Tests

# Runs on every push and pull request so each commit gets a tick or a cross.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
        # One run on the other platforms, the suite is platform independent
        # but the path handling is worth checking on Windows and macOS.
        include:
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install
        run: uv sync --frozen --extra epub --extra test

      - name: Run tests
        # conftest blocks network access, including native curl and browsers,
        # and excludes the manual live-provider checks from collection.
        run: uv run pytest -q --junitxml=results.xml

      - name: Publish the summary
        if: always()
        run: uv run python .github/scripts/test_summary.py results.xml >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Check
        run: uvx ruff check

      - name: Check formatting
        run: uvx ruff format --check
