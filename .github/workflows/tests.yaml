name: Tests

# Runs on every push and pull request so each commit gets a tick or a cross.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ['3.10', '3.11', '3.12', '3.13']
        # One run on the other platforms, the suite is platform independent
        # but the path handling is worth checking on Windows and macOS.
        include:
          - os: windows-latest
            python-version: '3.13'
          - os: macos-latest
            python-version: '3.13'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests
        run: pytest -q --junitxml=results.xml

      - name: Publish the summary
        if: always()
        run: python .github/scripts/test_summary.py results.xml >> "$GITHUB_STEP_SUMMARY"
        shell: bash

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install ruff
        run: pip install ruff

      # skip BLE001,S110,S112 for now as those are not really issues
      - name: Check
        run: ruff check src tests --ignore BLE001,S110,S112

      - name: Check formatting
        run: ruff format --check tests
